            <circle class="ball" cx="34" cy="59" r="4.6" fill="#e9e6dc"/>
          </svg>
        </div>
      </div>
      <svg class="azur-bed" aria-hidden="false" preserveAspectRatio="none">
        <a href="#bett" role="button" tabindex="0" aria-label="Zum Bett"><polygon points="0,0 0,0 0,0"/></a>
      </svg>
      <div class="azur-layer"></div>
    </div>
    <canvas class="azur-snap" aria-hidden="true" hidden></canvas>
    <p class="azur-hint" aria-live="polite"></p>
    <p class="azur-tease" aria-live="polite"></p>
    <p class="azur-bedlabel" aria-hidden="true">Bett</p>

    <p class="azur-missing">Die Raumbilder werden gerade gerendert</p>
